name: hermes-safeguard
version: "0.1.0"
description: >-
  Deterministic security middleware and EVM simulation guard. Simulates transactions and requests operator approval before broadcast.
author: pohtaytohpohtahtoh
license: MIT
homepage: https://github.com/robberdom/hermes-safeguard
tags:
  - security
  - evm
  - simulation
  - guardrails
  - onchain
requires_hermes: ">=0.22.0"
python_dependencies:
  - pyyaml>=6.0
requires_env:
  - name: SAFEGUARD_RPC_URL
    description: "Ethereum or Base JSON-RPC URL for transaction simulation"
    required: false
  - name: SAFEGUARD_THREAT_POLL_INTERVAL
    description: "Polling interval in seconds for Web3 security threat feeds"
    required: false
  - name: SAFEGUARD_TELEGRAM_BOT_TOKEN
    description: "Telegram Bot API token for operator alerts and interactive approvals"
    secret: true
    required: false
  - name: PECKSHIELD_API_URL
    description: "Custom API/feed URL for PeckShield threat ingestion"
    required: false
  - name: SCAMSNIFFER_API_URL
    description: "Custom API/feed URL for ScamSniffer phishing alerts"
    required: false
  - name: SLOWMIST_API_URL
    description: "Custom API URL for SlowMist / MistTrack security alerts"
    required: false
provides_tools:
  - safeguard_check_policy
  - safeguard_execute_tx
  - mint_nft
tools:
  safeguard_execute_tx:
    description: "Simulate and send, mint, swap, approve, or transfer onchain transactions (0x contract tx) under SafeGuard EVM simulation protection, requesting operator approval before broadcast."
  safeguard_check_policy:
    description: "Simulate and verify an onchain send, mint, swap, approve, or transfer transaction (0x contract tx) against SafeGuard security policies without executing, reporting simulated risk and findings."
provides_hooks:
  - pre_tool_call
