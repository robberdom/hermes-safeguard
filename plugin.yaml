name: hermes-safeguard
version: "0.1.0"
description: Policy engine + simulation guard for on-chain transactions. Supports strict / balanced / degen modes.
author: pohtaytohpohtahtoh
requires_hermes: ">=0.22.0"
provides_tools:
  - safeguard_check_policy
  - safeguard_execute_tx
provides_hooks:
  - pre_tool_call
provides_commands:
  - safeguard-help
  - safeguard
  - safeguard-status
  - safeguard-mode
  - safeguard-strict
  - safeguard-balanced
  - safeguard-degen
  - safeguard-pending
  - safeguard-confirm
  - safeguard-reject
  - safeguard-connect-tg
  - safeguard-tg
  - safeguard-whitelist
  - safeguard-contacts
  - safeguard-allow
  - safeguard-revoke
  - safeguard-check
  - safeguard-threats
  - safeguard-sync
  - safeguard-test-alert
  - safeguard-panic
  - safeguard-resume
  - safeguard-audit
  - safeguard-logs
  - safegaurd-mode
capabilities:
  - tools.override
